<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #16161a;
        color: #e4e4e7;
      }
      h1 { font-size: 14px; margin: 0 0 2px; }
      .sub { color: #a1a1aa; font-size: 11px; margin: 0 0 12px; }
      label { display: block; font-size: 11px; color: #a1a1aa; margin: 10px 0 4px; }
      input, select {
        width: 100%;
        box-sizing: border-box;
        background: #232329;
        border: 1px solid #34343c;
        color: #e4e4e7;
        border-radius: 8px;
        padding: 7px 8px;
        font: inherit;
      }
      .row { display: flex; gap: 8px; align-items: center; }
      .row input { flex: 1; }
      button {
        background: #4f46e5;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 7px 12px;
        font: inherit;
        cursor: pointer;
      }
      button.ghost { background: #232329; border: 1px solid #34343c; color: #e4e4e7; }
      .status { margin-top: 10px; font-size: 11px; min-height: 14px; }
      .ok { color: #4ade80; }
      .err { color: #f87171; }
      hr { border: 0; border-top: 1px solid #26262c; margin: 14px 0; }
    </style>
  </head>
  <body>
    <h1>Alter</h1>
    <p class="sub">Uses your desktop app's models. No keys stored here.</p>

    <label>Pairing token <span style="color:#71717a">(Alter → Settings → Browser bridge)</span></label>
    <div class="row">
      <input id="token" type="password" placeholder="paste token" />
      <button id="save" class="ghost">Save</button>
    </div>

    <hr />

    <label>Model for PR review</label>
    <select id="m-prReview"></select>

    <label>Model for PR description</label>
    <select id="m-prDesc"></select>

    <label>Model for grammar</label>
    <select id="m-grammar"></select>

    <div class="status" id="status"></div>
  </body>
  <script src="popup.js"></script>
</html>
