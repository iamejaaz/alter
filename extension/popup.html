<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 300px; margin: 0; padding: 14px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #16161a; color: #e4e4e7;
      }
      h1 { font-size: 14px; margin: 0 0 2px; }
      .sub { color: #a1a1aa; font-size: 11px; margin: 0 0 12px; }
      button {
        width: 100%; background: #4f46e5; color: #fff; border: 0;
        border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer;
      }
      button.ghost { background: #232329; border: 1px solid #34343c; color: #e4e4e7; margin-bottom: 8px; }
      .status { margin: 4px 0 12px; font-size: 11px; min-height: 14px; }
      .ok { color: #4ade80; }
      .err { color: #f87171; }
      #summary {
        margin-top: 10px; max-height: 220px; overflow-y: auto;
        white-space: pre-wrap; word-break: break-word;
        font-size: 12px; line-height: 1.5; color: #d4d4d8;
      }
      #summary:empty { display: none; }
      #summary .err { color: #f87171; }
    </style>
  </head>
  <body>
    <h1>Alter</h1>
    <p class="sub">Uses your desktop app's models. No keys stored here.</p>
    <div class="status" id="status"></div>
    <button id="settings" class="ghost">⚙ Settings &amp; models</button>
    <button id="describe-page">Describe this page</button>
    <div id="summary"></div>
    <script src="popup.js"></script>
  </body>
</html>
