<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 300px; margin: 0; padding: 14px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #16161a; color: #e4e4e7;
      }
      h1 { font-size: 14px; margin: 0 0 2px; }
      .sub { color: #a1a1aa; font-size: 11px; margin: 0 0 12px; }
      button {
        width: 100%; background: #4f46e5; color: #fff; border: 0;
        border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer;
      }
      button.ghost { background: #232329; border: 1px solid #34343c; color: #e4e4e7; margin-bottom: 8px; }
      .status { margin: 4px 0 12px; font-size: 11px; min-height: 14px; }
      .ok { color: #4ade80; }
      .err { color: #f87171; }
      #summary {
        margin-top: 10px; max-height: 220px; overflow-y: auto;
        white-space: pre-wrap; word-break: break-word;
        font-size: 12px; line-height: 1.5; color: #d4d4d8;
      }
      #summary:empty { display: none; }
      #summary .err { color: #f87171; }
      #runs:empty { display: none; }
      #runs { margin: 0 0 12px; }
      .runs-h { color: #a1a1aa; font-size: 11px; margin: 8px 0 4px; }
      .run { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-top: 1px solid #26262c; }
      .run:first-of-type { border-top: 0; }
      .run-mark { width: 10px; flex: none; text-align: center; color: #71717a; font-size: 11px; line-height: 18px; }
      .run-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #a1a1aa; animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.3; } }
      .run-main { min-width: 0; flex: 1; }
      .run-label { color: #e4e4e7; text-decoration: none; display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .run-label:hover { text-decoration: underline; }
      .run-sub { color: #71717a; font-size: 11px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .run-fail { color: #f87171; }
      .row2 { display: flex; gap: 8px; }
      .row2 #settings { flex: 1; }
      .row2 #update { width: auto; flex: none; padding-left: 14px; padding-right: 14px; }
      #update-note:empty { display: none; }
      #update-note { font-size: 12px; color: #a1a1aa; margin: -2px 0 10px; line-height: 1.45; }
      #update-note .err { color: #f87171; }
      #update-note ul { margin: 4px 0 0; padding-left: 16px; }
      .run-stop { width: auto; flex: none; background: transparent; border: 1px solid #34343c; color: #a1a1aa; padding: 2px 8px; font-size: 11px; border-radius: 6px; }
      .run-x { border: 0; padding: 0 4px; font-size: 14px; line-height: 18px; opacity: 0; }
      .run:hover .run-x { opacity: 1; }
      .run-x:hover, .runs-clear:hover { color: #e4e4e7; }
      .runs-h { display: flex; align-items: center; justify-content: space-between; }
      .runs-clear { width: auto; flex: none; background: transparent; border: 0; padding: 0; color: #71717a; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>Alter</h1>
    <p class="sub">Uses your desktop app's models. No keys stored here.</p>
    <div class="status" id="status"></div>
    <div id="runs"></div>
    <div class="row2">
      <button id="settings" class="ghost">⚙ Settings &amp; models</button>
      <button id="update" class="ghost" title="Pull the latest Alter from git, then reload this extension">Update</button>
    </div>
    <div id="update-note"></div>
    <button id="describe-page">Describe this page</button>
    <div id="summary"></div>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
